spring.application.name=banking-application
server.port=8088

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=SYSTEM
spring.datasource.password=${DB_PASSWORD}

# Oracle tables are created manually from database/schema.sql.
# "validate" verifies that Java entities match those existing tables without changing them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set JWT_SECRET to a strong signing secret before starting the application.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=30

# Local Ollama model used by the conversational banking service.
app.ollama.base-url=http://localhost:11434
app.ollama.chat-model=qwen3:4b-instruct
app.ollama.keep-alive=-1
