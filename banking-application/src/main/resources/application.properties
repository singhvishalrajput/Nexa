spring.application.name=banking-application
server.port=8088

spring.datasource.url=${BANKING_DB_URL:jdbc:oracle:thin:@localhost:1521:FREE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${BANKING_DB_USERNAME:SYSTEM}
spring.datasource.password=${BANKING_DB_PASSWORD}

# Oracle tables are created manually from database/schema.sql.
# "validate" verifies that Java entities match those existing tables without changing them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
