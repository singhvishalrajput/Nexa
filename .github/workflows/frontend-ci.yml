name: Frontend CI

on:
  push:
    branches: [rb-fe]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [rb-fe]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test and build web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
