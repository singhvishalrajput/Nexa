# Copy values into a non-committed environment-specific configuration source.
# Comma-separated origins are supported.
nexa.cors.allowed-origins=https://app.example.com
nexa.security.jwt.secret=set-through-NEXA_JWT_SECRET-with-at-least-32-random-bytes

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=NEXA_APP
spring.datasource.password=set-through-BANKING_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.flyway.locations=classpath:db/migration

server.port=8088

app.loans.annual-interest-rate=14.50
