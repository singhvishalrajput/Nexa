spring:
  application:
    name: banking-application
  profiles:
    default: local
  datasource:
    url: ${BANKING_DB_URL:${NEXA_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
    username: ${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}
    password: ${BANKING_DB_PASSWORD:${NEXA_DB_PASSWORD:}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    show-sql: ${BANKING_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}
    schemas: ${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Nexa API
    description: Conversational banking API

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

nexa:
  security:
    jwt:
      issuer: ${NEXA_JWT_ISSUER:nexa-api}
      secret: ${NEXA_JWT_SECRET:}
      access-token-ttl: ${NEXA_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${NEXA_REFRESH_TOKEN_TTL:7d}
