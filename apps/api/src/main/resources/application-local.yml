nexa:
  ai:
    enabled: ${NEXA_AI_ENABLED:true}
    base-url: ${NEXA_AI_BASE_URL:http://localhost:11434}
    model: ${NEXA_AI_MODEL:qwen3.5:4b}
    timeout-seconds: ${NEXA_AI_TIMEOUT_SECONDS:45}
  cors:
    allowed-origins: ${NEXA_CORS_ALLOWED_ORIGINS:http://localhost:8000}
  security:
    jwt:
      secret: ${NEXA_JWT_SECRET:nexa-local-development-secret-change-before-deployment}

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/local-migration
