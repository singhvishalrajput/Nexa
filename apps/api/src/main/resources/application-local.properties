nexa.ai.enabled=${NEXA_AI_ENABLED:true}
nexa.ai.base-url=${NEXA_AI_BASE_URL:http://localhost:11434}
nexa.ai.model=${NEXA_AI_MODEL:qwen3.5:4b}
nexa.ai.timeout-seconds=${NEXA_AI_TIMEOUT_SECONDS:45}
nexa.cors.allowed-origins=${NEXA_CORS_ALLOWED_ORIGINS:http://localhost:8000}
nexa.security.jwt.secret=${NEXA_JWT_SECRET:nexa-local-development-secret-change-before-deployment}

spring.datasource.hikari.connection-init-sql=ALTER SESSION SET TIME_ZONE='UTC'
spring.datasource.hikari.schema=${BANKING_DB_SCHEMA:${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}}
spring.flyway.locations=classpath:db/migration,classpath:db/local-migration
