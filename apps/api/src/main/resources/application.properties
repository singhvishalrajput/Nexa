spring.application.name=banking-application
spring.profiles.default=local
spring.datasource.url=${BANKING_DB_URL:${NEXA_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
spring.datasource.username=${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}
spring.datasource.password=${BANKING_DB_PASSWORD:${NEXA_DB_PASSWORD:}}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.show-sql=${BANKING_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${BANKING_DB_SCHEMA:${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}}
spring.flyway.schemas=${BANKING_DB_SCHEMA:${BANKING_DB_USERNAME:${NEXA_DB_USERNAME:NEXA_APP}}}

server.port=${SERVER_PORT:8088}

# OpenAPI JSON is served at /v3/api-docs and Swagger UI at /swagger-ui.html.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

info.app.name=Nexa API
info.app.description=Conversational banking API

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

nexa.admin.bootstrap.email=${NEXA_ADMIN_EMAIL:}
nexa.admin.bootstrap.password=${NEXA_ADMIN_PASSWORD:}
nexa.security.jwt.issuer=${NEXA_JWT_ISSUER:nexa-api}
nexa.security.jwt.secret=${NEXA_JWT_SECRET:}
nexa.security.jwt.access-token-ttl=${NEXA_ACCESS_TOKEN_TTL:15m}
nexa.security.jwt.refresh-token-ttl=${NEXA_REFRESH_TOKEN_TTL:7d}

# Customer-facing card assistance; set to the bank-approved support number.
nexa.cards.support-phone=${NEXA_CARD_SUPPORT_PHONE:88000 00067}
nexa.cards.support-email=${NEXA_CARD_SUPPORT_EMAIL:nexa@help.bank.in}
